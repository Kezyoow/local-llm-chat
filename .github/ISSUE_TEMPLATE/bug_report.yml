name: Bug report
description: 报告一个问题 / Report a problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填完整，否则很难定位。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 清楚描述现象，有截图更好
      placeholder: 打开设置点了"获取列表"，然后提示……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 ollama serve
        2. 打开程序，进设置
        3. 点"测试"
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 你期望的行为
      placeholder: 应该显示"连接成功"
    validations:
      required: false

  - type: input
    id: backend
    attributes:
      label: 推理服务与版本
      placeholder: Ollama 0.40.13 / LM Studio 0.3.9 / llama.cpp b6000
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: 模型
      placeholder: qwen3-8b-q5_K_M
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 系统与 Python
      placeholder: Windows 11 24H2 / Python 3.12.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 报错信息
      description: 控制台输出或弹窗文字
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜过现有 Issue，没有重复
          required: true
        - label: 我用的是最新版本
          required: false

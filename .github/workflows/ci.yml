name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: syntax · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile every Python source
        run: python -m compileall -q .

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip -q && python -m pip install -q -r requirements.txt

      - name: Unit smoke tests
        run: python tests/test_basic.py

      - name: Import the non-GUI modules
        run: python -c "import providers, extract; print('providers + extract OK')"

      # tkinter 在部分 runner 上可能缺失，所以这一步允许失败
      - name: Import the GUI module (best effort)
        continue-on-error: true
        run: python -c "import qwen_chat; print('qwen_chat import OK')"
